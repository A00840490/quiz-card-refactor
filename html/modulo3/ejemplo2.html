<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejemplo 2 CSS</title>
<style>
    p {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 32px;
    }
    #rojo {
        color: red;
    }
    .azul {
        color: blue;
    }
    .pequeño {
        font-size: 18px;
    }
</style>
</head>
<body>
    <p id="rojo">Este texto se modificó usando un ID.</p>
    <p class="azul">Este texto se modificó usando una clase.</p>
    <p class="azul pequeño">Este texto también se modificó usando clases.</p>
</body>
</html>
