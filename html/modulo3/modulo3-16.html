                                <p>Los márgenes también aceptan otro valor, denominado <span class="code">auto</span>, el cual permite que el navegador calcule el valor. Un uso común de este valor se da en márgenes para centrar elementos, como en el siguiente ejemplo: </p>
                                <div data-demo data-archivo="estilos.css">
                                  <script type="text/x-codigo">

                                      color: white;
                                    }
                                  </script>

                                  </script>
